<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>미로</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #ffb6c1; /* 몽환적인 파스텔 핑크 */
            font-family: 'Inter', sans-serif; user-select: none;
            -webkit-user-select: none; touch-action: none;
        }
        
        #game-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
        }

        /* 드림코어 UI 스타일 */
        .overlay-panel {
            pointer-events: auto; background: rgba(255, 253, 240, 0.85); /* 빛바랜 노란/아이보리 톤 */
            backdrop-filter: blur(15px); padding: 1.5rem; border-radius: 1rem;
            border: 2px solid rgba(217, 119, 6, 0.4); text-align: center;
            box-shadow: 0 25px 50px -12px rgba(217, 119, 6, 0.3); color: #333;
            transition: opacity 0.3s ease; 
            width: 90%; max-width: 400px; 
            max-height: 85vh; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 1rem;
        }

        .overlay-panel::-webkit-scrollbar { width: 6px; }
        .overlay-panel::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.5); border-radius: 3px; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            background: rgba(0,0,0,0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 6; display: flex; flex-direction: column;
            justify-content: space-between; padding: 1.5rem; box-sizing: border-box;
        }

        .stamina-container { width: 180px; background: rgba(255, 253, 240, 0.9); padding: 10px; border-radius: 12px; border: 2px solid rgba(217, 119, 6, 0.5); box-shadow: 0 4px 15px rgba(217, 119, 6, 0.2); }
        .stamina-bar-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin-top: 6px; overflow: hidden; }
        .stamina-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #d97706, #fbbf24); transition: width 0.08s linear; }
        .stamina-bar-fill.exhausted { background: linear-gradient(90deg, #475569, #94a3b8); }

        #minimap-wrapper {
            width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(217, 119, 6, 0.6);
            background: rgba(255, 253, 240, 0.9); overflow: hidden; position: relative; box-shadow: 0 0 15px rgba(217, 119, 6, 0.3);
            flex-shrink: 0;
        }
        #minimap-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #fall-overlay {
            position: absolute; inset: 0; pointer-events: none;
            background: rgba(255, 255, 255, 0.8); opacity: 0; transition: opacity 0.15s ease; z-index: 4;
            mix-blend-mode: difference;
        }

        /* 모바일 컨트롤 UI */
        #mobile-controls { position: absolute; inset: 0; pointer-events: none; z-index: 15; display: none; }
        .touch-zone { position: absolute; top: 0; height: 100%; pointer-events: auto; }
        #joystick-zone { left: 0; width: 50%; }
        #look-zone { right: 0; width: 50%; }
        #joystick-base {
            position: absolute; width: 100px; height: 100px; background: rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(0, 0, 0, 0.3); border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none;
        }
        #joystick-stick { position: absolute; width: 40px; height: 40px; background: rgba(0, 0, 0, 0.4); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        #mobile-buttons { position: absolute; right: 20px; bottom: 30px; display: flex; gap: 15px; pointer-events: auto; }
        .mobile-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(0,0,0,0.1); border: 2px solid rgba(0,0,0,0.3); color: #333; font-weight: bold; font-size: 13px; display: flex; justify-content: center; align-items: center; user-select: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .mobile-btn.active-toggle { background: rgba(217, 119, 6, 0.3); border-color: #d97706; color: #d97706; }

        #ytplayer-container { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -100; }

        @media (max-width: 768px) {
            #minimap-wrapper { width: 100px; height: 100px; }
            #pc-instructions { display: none; }
            .overlay-panel { padding: 1.25rem; }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }

    </script>
</head>

        <div id="device-screen" class="overlay-panel">
            <div>
                <h1 class="text-2xl font-extrabold text-yellow-700 tracking-widest">미로</h1>
                <p class="text-xs text-slate-500 mt-2 font-semibold">끝없는 공간에서 탈출구를 찾으세요.</p>

            <div class="flex gap-2">

            <button id="start-btn" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-600 text-white font-bold rounded-lg shadow-lg text-sm transition active:scale-95" style="display:none;">

            </div>
            
            <div class="bg-yellow-50/60 p-3 rounded-lg border border-yellow-200 text-left text-sm">
                <p class="text-slate-600 font-bold">⏱️ 헤맨 시간: <span id="final-time" class="font-bold text-yellow-600 text-base">0초</span></p>
                <p class="text-slate-600 font-bold mt-1">💀 추락 횟수: <span id="death-count" class="font-bold text-amber-600 text-base">0회</span></p>
            </div>

            <input type="text" id="player-name" placeholder="방랑자의 이름 (최대 8자)" maxlength="8" class="w-full bg-white text-yellow-900 border border-yellow-400 rounded p-2 text-center font-bold text-sm outline-none focus:border-yellow-600">

            <button id="save-rank-btn" class="w-full py-3 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded-lg shadow-lg text-sm transition active:scale-95">

    <script>
        window.ytPlayer = null;
        window.ytPlayerReady = false;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            window.ytPlayer = new YT.Player('ytplayer-container', {
                height: '100', width: '100',
                videoId: 'XnURPQOA3qk',
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'XnURPQOA3qk', 'rel': 0, 'showinfo': 0 },
                events: {
                    'onReady': function(event) {
                        event.target.setVolume(40); // 브금 볼륨 (0~100)
                        window.ytPlayerReady = true;
                    }
                }
            });
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        
        let camera, scene, renderer, controls;
        let flashlight, portalGroup, goalMesh;
        const STAMINA_DRAIN_RATE = 20, STAMINA_RECOVERY_RATE = 30; let isExhausted = false;

        const GRID_ROWS = 31, GRID_COLS = 31;
        const CELL_SIZE = 6.0, PLATFORM_SIZE = 3.6, WALL_HEIGHT = 16.0, FLOOR_HEIGHT = 1.0;
        const PLAYER_HEIGHT = 1.6, PLAYER_SIZE = 0.6;
        let mazeGrid = [], solidBoxes = [], goalBox;
        let startPosWorld = new THREE.Vector3();

        // --- 여기서부터 누락되었던 필수 게임 상태 변수들을 다시 선언합니다 ---
        let physicalY = 0;
        let velocity = new THREE.Vector3();
        let canJump = false;
        let bobTimer = 0;
        let isPlaying = false;
        let gameWon = false;
        let startTime = null;
        let prevTime = performance.now();
        let falls = 0;
        let finalTimeInSeconds = 0;
        let deviceType = 'pc';

        // 키보드 및 이동 상태 변수
        let moveForward = false, moveBackward = false;
        let moveLeft = false, moveRight = false;
        let isSprinting = false;

        // 물리 엔진 상수
        const WALK_SPEED = 20.0, SPRINT_SPEED = 27.0, GRAVITY = 85.0, JUMP_FORCE = 25.0;
        const MAX_STAMINA = 100;
        let stamina = MAX_STAMINA;

        // 체크포인트 변수
        let checkpointReached = false;
        let checkpointRespawnsLeft = 3;
        let activeRespawnPos = new THREE.Vector3();

        // 모바일 조이스틱 변수
        let joystickVector = { x: 0, y: 0 };
        let activeTouches = {};
        let joystickTouchId = null, lookTouchId = null;
        let joystickBaseX = 0, joystickBaseY = 0;
        const MAX_JOYSTICK_DIST = 40;
        // -----------------------------------------------------------

        function loadRankings() {
            let ranks = JSON.parse(localStorage.getItem('dreamcore_ranks')) || [];
            let html = '';
            ranks.slice(0, 5).forEach((r, i) => {
                html += `<div class="text-xs text-slate-600 flex justify-between border-b border-yellow-200 py-1.5 font-bold"><span>${i+1}. ${r.name}</span> <span class="text-yellow-600 font-mono">${r.time}초</span></div>`;
            });
            if (!html) html = '<div class="text-xs text-slate-400 py-2 text-center">아직 깬 사람이 없습니다.</div>';
            document.getElementById('ranking-list').innerHTML = html;
        }

        function findShortestPathBFS(grid, startR, startC, goalR, goalC) {
            let queue = [{r: startR, c: startC, path: []}];
            let visited = Array.from({length: grid.length}, () => Array(grid[0].length).fill(false));
            visited[startR][startC] = true;

            while(queue.length > 0) {
                let curr = queue.shift();
                let currPath = [...curr.path, {r: curr.r, c: curr.c}];
                if(curr.r === goalR && curr.c === goalC) return currPath;

                const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                for(let [dr, dc] of dirs) {
                    let nr = curr.r + dr, nc = curr.c + dc;
                    if(nr > 0 && nr < grid.length - 1 && nc > 0 && nc < grid[0].length - 1) {
                        if(grid[nr][nc] !== 1 && !visited[nr][nc]) {
                            visited[nr][nc] = true;
                            queue.push({r: nr, c: nc, path: currPath});
                        }
                    }
                }
            }
            return [];
        }

        function generateProceduralMaze(rows, cols) {
            const grid = Array.from({ length: rows }, () => Array(cols).fill(1));
            function carveDFS(r, c) {
                grid[r][c] = 0; 
                const dirs = [ [-2, 0], [2, 0], [0, -2], [0, 2] ].sort(() => Math.random() - 0.5);
                for (let [dr, dc] of dirs) {
                    let nr = r + dr, nc = c + dc;
                    if (nr > 0 && nr < rows - 1 && nc > 0 && nc < cols - 1 && grid[nr][nc] === 1) {
                        grid[r + dr / 2][c + dc / 2] = 0; carveDFS(nr, nc);
                    }
                }
            }
            carveDFS(1, 1);
            const path = findShortestPathBFS(grid, 1, 1, rows - 2, cols - 2);
            
            const trapCount = 10;
            const startIndex = Math.max(1, path.length - 1 - trapCount);
            const checkpointIndex = Math.max(1, startIndex - 1);
            
            for(let i = startIndex; i < path.length - 1; i++) grid[path[i].r][path[i].c] = 4;
            
            grid[1][1] = 2; grid[rows - 2][cols - 2] = 3;
            if (grid[path[checkpointIndex].r][path[checkpointIndex].c] !== 2 && grid[path[checkpointIndex].r][path[checkpointIndex].c] !== 3) {
                grid[path[checkpointIndex].r][path[checkpointIndex].c] = 5; 
            }
            return grid;
        }

        // 백룸 스타일 누런 벽지 텍스처
        function createWallpaperTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#d1c083'; 
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#c0ae6f';
            for(let x = 0; x < 256; x += 32) { ctx.fillRect(x, 0, 16, 256); }
            ctx.fillStyle = '#a69251';
            for(let y = 0; y < 256; y += 64) {
                for(let x = 0; x < 256; x += 32) {
                    let offsetY = (x / 32) % 2 === 0 ? 0 : 32; 
                    ctx.beginPath();
                    ctx.moveTo(x + 16, y + offsetY + 8);
                    ctx.lineTo(x + 24, y + offsetY + 24);
                    ctx.lineTo(x + 16, y + offsetY + 40);
                    ctx.lineTo(x + 8, y + offsetY + 24);
                    ctx.fill();
                    ctx.fillRect(x + 14, y + offsetY + 2, 4, 4);
                    ctx.fillRect(x + 14, y + offsetY + 42, 4, 4);
                }
            }
            for (let n = 0; n < 800; n++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.05)' : 'rgba(100,80,0,0.06)';
                let nx = Math.random() * 256;
                let ny = Math.random() * 256;
                ctx.fillRect(nx, ny, 2 + Math.random() * 3, 2 + Math.random() * 3);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(3, 3);
            return texture;
        }

        // 수영장(Poolcore) 타일 텍스처
        function createPoolTileTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d'); 
            ctx.fillStyle = '#e0ffff'; ctx.fillRect(0, 0, 256, 256); 
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
            for(let x = 0; x <= 256; x += 32) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, x); ctx.lineTo(256, x); ctx.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping; texture.repeat.set(8, 8);
            return texture;
        }

        // 체커보드(함정 발판) 텍스처
        function createCheckerTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            for(let y = 0; y < 128; y += 64) {
                for(let x = 0; x < 128; x += 64) {
                    ctx.fillStyle = ((x/64 + y/64) % 2 === 0) ? '#ffffff' : '#ff69b4';
                    ctx.fillRect(x, y, 64, 64);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping; texture.repeat.set(2, 2);
            return texture;
        }

        function buildEnvironment() {
            const wallTex = createWallpaperTexture();
            const floorTex = createPoolTileTexture();
            const trapTex = createCheckerTexture();

            const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 1.0 });
            const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.2, metalness: 0.1 });
            const trapMat = new THREE.MeshStandardMaterial({ map: trapTex, roughness: 0.8 }); 

            const wallGeo = new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, CELL_SIZE);
            const floorGeo = new THREE.BoxGeometry(CELL_SIZE, FLOOR_HEIGHT, CELL_SIZE); 
            const trapGeo = new THREE.BoxGeometry(PLATFORM_SIZE, FLOOR_HEIGHT, PLATFORM_SIZE); 

            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const cell = mazeGrid[r][c];
                    const x = (c - GRID_COLS / 2) * CELL_SIZE, z = (r - GRID_ROWS / 2) * CELL_SIZE;

                    if (cell === 1) { 
                        const wall = new THREE.Mesh(wallGeo, wallMat); wall.position.set(x, WALL_HEIGHT / 2 - 2, z); 
                        scene.add(wall); solidBoxes.push(new THREE.Box3().setFromObject(wall));
                    } else if (cell === 0 || cell === 2 || cell === 3) { 
                        const floor = new THREE.Mesh(floorGeo, floorMat); floor.position.set(x, FLOOR_HEIGHT / 2, z);
                        scene.add(floor); solidBoxes.push(new THREE.Box3().setFromObject(floor));
                        if (cell === 2) { 
                            startPosWorld.set(x, FLOOR_HEIGHT + PLAYER_HEIGHT, z); camera.position.copy(startPosWorld); physicalY = startPosWorld.y;
                        } else if (cell === 3) { 
                            portalGroup = new THREE.Group(); portalGroup.position.set(x, FLOOR_HEIGHT + 2.0, z);
                            goalMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 0), new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff1493, emissiveIntensity: 1.5, wireframe: true }));
                            const coreMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.0 }));
                            portalGroup.add(goalMesh); portalGroup.add(coreMesh);
                            portalGroup.add(new THREE.PointLight(0xff1493, 3.0, 15));
                            scene.add(portalGroup); goalBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(x, FLOOR_HEIGHT + 2.0, z), new THREE.Vector3(2.5, 4, 2.5));
                        }
                    } else if (cell === 5) { 
                        const cpMat = new THREE.MeshStandardMaterial({ color: 0xd97706, emissive: 0xb45309, emissiveIntensity: 0.6 });
                        const cpFloor = new THREE.Mesh(floorGeo, cpMat); cpFloor.position.set(x, FLOOR_HEIGHT / 2, z);
                        scene.add(cpFloor); solidBoxes.push(new THREE.Box3().setFromObject(cpFloor));
                        scene.add(new THREE.PointLight(0xd97706, 2.0, 12)).position.set(x, FLOOR_HEIGHT + 1, z);
                    } else if (cell === 4) { 
                        const plat = new THREE.Mesh(trapGeo, trapMat); plat.position.set(x, (Math.random() * 2.0) - 1.0 + FLOOR_HEIGHT/2, z);
                        scene.add(plat); solidBoxes.push(new THREE.Box3().setFromObject(plat));
                    }
                }
            }
        }

        function init() {
            loadRankings();
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0xffc0cb); // 파스텔 핑크 안개
            scene.fog = new THREE.FogExp2(0xffc0cb, 0.05); 
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // 밝고 플랫한 조명
            scene.add(new THREE.AmbientLight(0xffffff, 0.9)); 
            scene.add(camera);

            mazeGrid = generateProceduralMaze(GRID_ROWS, GRID_COLS); buildEnvironment();

            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

            document.getElementById('btn-select-pc').addEventListener('click', () => { deviceType = 'pc'; setupDeviceUI(); });
            document.getElementById('btn-select-mobile').addEventListener('click', () => { deviceType = 'mobile'; setupDeviceUI(); });
            document.getElementById('start-btn').addEventListener('click', startGame);
            
            document.getElementById('save-rank-btn').addEventListener('click', () => {
                let name = document.getElementById('player-name').value || '무명방랑자';
                let ranks = JSON.parse(localStorage.getItem('dreamcore_ranks')) || [];
                ranks.push({ name: name, time: finalTimeInSeconds });
                ranks.sort((a, b) => a.time - b.time);
                localStorage.setItem('dreamcore_ranks', JSON.stringify(ranks));
                location.reload();
            });
        }

        function setupDeviceUI() {
            document.getElementById('btn-select-pc').classList.toggle('bg-yellow-300', deviceType === 'pc');
            document.getElementById('btn-select-mobile').classList.toggle('bg-yellow-300', deviceType === 'mobile');
            document.getElementById('start-btn').style.display = 'block';
        }

        function startGame() {
            document.getElementById('device-screen').style.display = 'none';
            isPlaying = true; if (!startTime) startTime = Date.now();
            
            // 유튜브 브금 재생
            if (window.ytPlayerReady && window.ytPlayer && typeof window.ytPlayer.playVideo === 'function') {
                window.ytPlayer.playVideo();
            }
            
            checkpointReached = false;
            checkpointRespawnsLeft = 3;
            document.getElementById('checkpoint-info').classList.add('hidden');
            document.getElementById('checkpoint-info').classList.remove('opacity-50');
            document.getElementById('checkpoint-info').innerHTML = '👁️ 누군가 지켜보고 있습니다... 부활: <span id="cp-count">3</span>회 남음';

            if(deviceType === 'pc') {
                controls = new PointerLockControls(camera, document.body);
                controls.addEventListener('unlock', () => { if(!gameWon) { isPlaying = false; document.getElementById('device-screen').style.display = 'flex'; }});
                controls.lock();
                
                document.addEventListener('keydown', (e) => {
                    if(!isPlaying) return;
                    switch(e.code) { case 'KeyW': moveForward=true; break; case 'KeyA': moveLeft=true; break; case 'KeyS': moveBackward=true; break; case 'KeyD': moveRight=true; break; case 'ShiftLeft': isSprinting=true; break; case 'Space': if(canJump) { velocity.y = JUMP_FORCE; canJump = false; } break; }
                });
                document.addEventListener('keyup', (e) => { switch(e.code) { case 'KeyW': moveForward=false; break; case 'KeyA': moveLeft=false; break; case 'KeyS': moveBackward=false; break; case 'KeyD': moveRight=false; break; case 'ShiftLeft': isSprinting=false; break; }});
            } else {
                document.getElementById('mobile-controls').style.display = 'block'; document.getElementById('crosshair').style.display = 'block';
                setupMobileTouch();
            }
        }

        function setupMobileTouch() {
            const base = document.getElementById('joystick-base'), stick = document.getElementById('joystick-stick');
            const btnJ = document.getElementById('btn-jump-mobile'), btnS = document.getElementById('btn-sprint-mobile');

            document.addEventListener('touchstart', (e) => {
                if(!isPlaying) return; if(e.target.tagName !== 'BUTTON' && !e.target.classList.contains('mobile-btn')) e.preventDefault();
                for(let i=0; i<e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if(t.target === btnJ) { if(canJump) { velocity.y = JUMP_FORCE; canJump = false; } continue; }
                    if(t.target === btnS) { isSprinting = !isSprinting; btnS.classList.toggle('active-toggle'); continue; }
                    if(t.clientX < window.innerWidth/2 && !joystickTouchId) {
                        joystickTouchId = t.identifier; joystickBaseX = t.clientX; joystickBaseY = t.clientY;
                        base.style.display = 'block'; base.style.left = `${joystickBaseX}px`; base.style.top = `${joystickBaseY}px`; stick.style.transform = `translate(-50%, -50%)`;
                    } else if(t.clientX >= window.innerWidth/2 && !lookTouchId) {
                        lookTouchId = t.identifier; activeTouches[t.identifier] = { x: t.clientX, y: t.clientY };
                    }
                }
            }, {passive: false});

            document.addEventListener('touchmove', (e) => {
                if(!isPlaying) return; e.preventDefault();
                for(let i=0; i<e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if(t.identifier === joystickTouchId) {
                        let dx = t.clientX - joystickBaseX, dy = t.clientY - joystickBaseY, dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist > MAX_JOYSTICK_DIST) { dx = (dx/dist)*MAX_JOYSTICK_DIST; dy = (dy/dist)*MAX_JOYSTICK_DIST; }
                        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                        joystickVector.x = dx / MAX_JOYSTICK_DIST; joystickVector.y = dy / MAX_JOYSTICK_DIST;
                    } else if(t.identifier === lookTouchId) {
                        let last = activeTouches[t.identifier], mx = t.clientX - last.x, my = t.clientY - last.y;
                        let euler = new THREE.Euler(0,0,0,'YXZ'); euler.setFromQuaternion(camera.quaternion);
                        euler.y -= mx * 0.005; euler.x -= my * 0.005; euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
                        camera.quaternion.setFromEuler(euler); activeTouches[t.identifier] = { x: t.clientX, y: t.clientY };
                    }
                }
            }, {passive: false});

            document.addEventListener('touchend', (e) => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if(t.identifier === joystickTouchId) { joystickTouchId = null; joystickVector = {x:0, y:0}; base.style.display = 'none'; }
                    else if(t.identifier === lookTouchId) { lookTouchId = null; delete activeTouches[t.identifier]; }
                }
            });
        }

        function getPlayerAABB(px, py, pz) { return new THREE.Box3(new THREE.Vector3(px - PLAYER_SIZE/2, py - PLAYER_HEIGHT, pz - PLAYER_SIZE/2), new THREE.Vector3(px + PLAYER_SIZE/2, py + 0.1, pz + PLAYER_SIZE/2)); }
        
        function hasLineOfSight(r0, c0, r1, c1, grid) {
            let dx = Math.abs(c1 - c0), dy = Math.abs(r1 - r0), sx = (c0 < c1) ? 1 : -1, sy = (r0 < r1) ? 1 : -1, err = dx - dy, currR = r0, currC = c0;
            while (true) {
                if (currR === r1 && currC === c1) return true; 
                if (grid[currR][currC] === 1 && (currR !== r0 || currC !== c0)) return false; 
                let e2 = 2 * err; if (e2 > -dy) { err -= dy; currC += sx; } if (e2 < dx) { err += dx; currR += sy; }
            }
        }

        function drawMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            const ctx = canvas.getContext('2d');
            const scale = 3.2, cx = canvas.width / 2, cy = canvas.height / 2;
            const playerGridC = Math.round(camera.position.x / CELL_SIZE) + Math.floor(GRID_COLS / 2), playerGridR = Math.round(camera.position.z / CELL_SIZE) + Math.floor(GRID_ROWS / 2);
            
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.save(); ctx.translate(cx, cy);
            const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir); ctx.rotate(Math.atan2(camDir.x, -camDir.z)); ctx.translate(-camera.position.x * scale, -camera.position.z * scale);
            
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (Math.abs(r - playerGridR) > 8 || Math.abs(c - playerGridC) > 8) continue;
                    if (!hasLineOfSight(playerGridR, playerGridC, r, c, mazeGrid)) continue;
                    const x = (c - GRID_COLS / 2) * CELL_SIZE, z = (r - GRID_ROWS / 2) * CELL_SIZE;
                    if (mazeGrid[r][c] === 1) { ctx.fillStyle = '#d1c083'; ctx.fillRect((x - CELL_SIZE/2) * scale, (z - CELL_SIZE/2) * scale, CELL_SIZE * scale, CELL_SIZE * scale); } 
                    else if (mazeGrid[r][c] === 5) { ctx.fillStyle = '#b45309'; ctx.fillRect((x - CELL_SIZE/2) * scale, (z - CELL_SIZE/2) * scale, CELL_SIZE * scale, CELL_SIZE * scale); }
                    else if (mazeGrid[r][c] === 4) { ctx.fillStyle = '#ea580c'; ctx.fillRect((x - PLATFORM_SIZE/2) * scale, (z - PLATFORM_SIZE/2) * scale, PLATFORM_SIZE * scale, PLATFORM_SIZE * scale); } 
                    else { ctx.fillStyle = '#e0ffff'; ctx.fillRect((x - CELL_SIZE/2) * scale, (z - CELL_SIZE/2) * scale, CELL_SIZE * scale, CELL_SIZE * scale); }
                }
            }
            
            if (portalGroup) { ctx.fillStyle = '#ff1493'; ctx.beginPath(); ctx.arc(portalGroup.position.x * scale, portalGroup.position.z * scale, 2.5 * scale, 0, Math.PI * 2); ctx.fill(); }
            ctx.restore(); ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-5, 5); ctx.lineTo(5, 5); ctx.fill(); ctx.restore();
        }

        function killPlayer() {
            document.getElementById('fall-overlay').style.opacity = '1';
            setTimeout(() => { document.getElementById('fall-overlay').style.opacity = '0'; }, 300);

            if (checkpointReached && checkpointRespawnsLeft > 0) {
                camera.position.copy(activeRespawnPos); physicalY = activeRespawnPos.y;
                checkpointRespawnsLeft--;
                document.getElementById('cp-count').innerText = checkpointRespawnsLeft;
                if(checkpointRespawnsLeft === 0) {
                    document.getElementById('checkpoint-info').classList.add('opacity-50');
                    document.getElementById('checkpoint-info').innerHTML = '더 이상 당신을 지켜보지 않습니다 ☁️';
                }
            } else {
                camera.position.copy(startPosWorld); physicalY = startPosWorld.y; 
                checkpointReached = false; checkpointRespawnsLeft = 3;
                document.getElementById('checkpoint-info').classList.add('hidden');
            }
            velocity.set(0,0,0); stamina = MAX_STAMINA; isExhausted = false; falls++;
        }

        function animate() {
            requestAnimationFrame(animate); if (gameWon) return;
            const time = performance.now(), delta = Math.min((time - prevTime) / 1000, 0.1);

            if (isPlaying) {
                if (startTime) {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById('timer-display').innerText = `${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
                }

                let inputX = deviceType === 'pc' ? Number(moveRight) - Number(moveLeft) : joystickVector.x;
                let inputZ = deviceType === 'pc' ? Number(moveForward) - Number(moveBackward) : -joystickVector.y;
                const length = Math.sqrt(inputX*inputX + inputZ*inputZ); if (length > 1) { inputX /= length; inputZ /= length; }
                const isMoving = length > 0.05;

                const pGridC = Math.round(camera.position.x / CELL_SIZE) + Math.floor(GRID_COLS / 2);
                const pGridR = Math.round(camera.position.z / CELL_SIZE) + Math.floor(GRID_ROWS / 2);
                
                // 체크포인트 도달 확인
                if (mazeGrid[pGridR] && mazeGrid[pGridR][pGridC] === 5 && !checkpointReached) {
                    checkpointReached = true;
                    activeRespawnPos.copy(camera.position); activeRespawnPos.y = FLOOR_HEIGHT + PLAYER_HEIGHT;
                    document.getElementById('checkpoint-info').classList.remove('hidden');
                    
                    const msg = document.createElement('div');
                    msg.innerText = "👁️ 시선이 느껴집니다... (이속 증가)";
                    msg.className = "absolute top-1/4 left-1/2 transform -translate-x-1/2 text-yellow-900 font-extrabold text-xl md:text-2xl drop-shadow-md z-50 animate-pulse bg-yellow-50/90 px-5 py-2 rounded-full border border-yellow-500";
                    document.body.appendChild(msg);
                    setTimeout(() => msg.remove(), 2500);
                }

                let speedMultiplier = checkpointReached ? 1.35 : 1.0;

                const wantsToSprint = isSprinting && isMoving;
                if (wantsToSprint && !isExhausted && stamina > 0) { stamina -= STAMINA_DRAIN_RATE * delta; if (stamina <= 0) { stamina = 0; isExhausted = true; } } 
                else { stamina += STAMINA_RECOVERY_RATE * delta; if (stamina >= MAX_STAMINA) stamina = MAX_STAMINA; if (isExhausted && stamina >= 30) { isExhausted = false; if(deviceType === 'mobile') document.getElementById('btn-sprint-mobile').classList.remove('active-toggle'); isSprinting = false;} }
                
                const currentlySprinting = wantsToSprint && !isExhausted && stamina > 0; 
                const currentMoveSpeed = (currentlySprinting ? SPRINT_SPEED : WALK_SPEED) * speedMultiplier;
                
                // 스테미너 UI 업데이트
                document.getElementById('stamina-fill').style.width = `${Math.round(stamina)}%`;
                document.getElementById('stamina-percent').innerText = `${Math.round(stamina)}%`;
                if(isExhausted) document.getElementById('stamina-fill').classList.add('exhausted'); else document.getElementById('stamina-fill').classList.remove('exhausted');

                velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;
                if (isMoving) { velocity.z -= inputZ * currentMoveSpeed * delta; velocity.x -= inputX * currentMoveSpeed * delta; }

                // 수직 물리 처리
                velocity.y -= GRAVITY * delta; const nextY = physicalY + velocity.y * delta;
                let px = camera.position.x, pz = camera.position.z, collidedY = false;
                const boxY = getPlayerAABB(px, nextY, pz);
                for (let box of solidBoxes) {
                    if (boxY.intersectsBox(box)) {
                        if (velocity.y < 0) { physicalY = box.max.y + PLAYER_HEIGHT; velocity.y = 0; canJump = true; collidedY = true; } 
                        else if (velocity.y > 0) { physicalY = box.min.y + PLAYER_HEIGHT - 0.1; velocity.y = 0; collidedY = true; } break;
                    }
                }
                if (!collidedY) { physicalY = nextY; canJump = false; }

                let bobOffset = 0; if (isMoving && canJump) { bobTimer += delta * (currentlySprinting ? 14 : 9); bobOffset = Math.sin(bobTimer) * (currentlySprinting ? 0.08 : 0.04); }
                camera.position.y = physicalY + bobOffset;

                // 수평 이동 처리
                const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
                const camRight = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();
                const deltaX = (-camRight.x * velocity.x - camDir.x * velocity.z) * delta, deltaZ = (-camRight.z * velocity.x - camDir.z * velocity.z) * delta;

                camera.position.x += deltaX; px = camera.position.x;
                for (let box of solidBoxes) { if (getPlayerAABB(px, physicalY + 0.1, pz).intersectsBox(box)) { camera.position.x -= deltaX; px = camera.position.x; break; } }
                camera.position.z += deltaZ; pz = camera.position.z;
                for (let box of solidBoxes) { if (getPlayerAABB(px, physicalY + 0.1, pz).intersectsBox(box)) { camera.position.z -= deltaZ; pz = camera.position.z; break; } }

                if (physicalY < -15) { killPlayer(); }

                if (goalBox && getPlayerAABB(px, physicalY, pz).intersectsBox(goalBox)) {
                    gameWon = true; isPlaying = false; if(deviceType === 'pc') controls.unlock();
                    document.getElementById('mobile-controls').style.display = 'none'; document.getElementById('win-screen').style.display = 'flex';
                    
                    // 탈출 시 브금 정지
                    if (window.ytPlayerReady && window.ytPlayer && typeof window.ytPlayer.pauseVideo === 'function') {
                        window.ytPlayer.pauseVideo();
                    }
                    
                    finalTimeInSeconds = Math.floor((Date.now() - startTime) / 1000);
                    document.getElementById('final-time').innerText = `${finalTimeInSeconds}초`; document.getElementById('death-count').innerText = `${falls}회`;
                }
                drawMinimap();
            }
            if (portalGroup && goalMesh) { goalMesh.rotation.x += 0.01; goalMesh.rotation.y += 0.02; goalMesh.rotation.z += 0.01; }
            prevTime = time; renderer.render(scene, camera);
        }

        init(); animate();
    </script>
</body>
</html>
